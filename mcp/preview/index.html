<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Frets MCP Apps preview</title>
    <style>
      body { margin: 0; font: 14px/20px system-ui, sans-serif; background: #ece7df; color: #1b1410; }
      body[data-theme='dark'] { background: #1e1915; color: #f3ece2; }
      .layout { --side: 320px; display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
      .side { position: relative; min-width: 0; padding: 16px; border-right: 1px solid #0002; display: grid; align-content: start; gap: 12px; }
      .side h1 { font-size: 18px; margin: 0; }
      .side p { margin: 0; color: #776; }
      .side .commit { font-size: 12px; }
      .commit a { color: inherit; text-decoration: none; }
      .commit a:hover { color: #1b1410; }
      body[data-theme='dark'] .commit a:hover { color: #f3ece2; }
      label { display: grid; gap: 4px; font-weight: 600; }
      textarea { font: 12px/16px ui-monospace, monospace; min-height: 160px; }
      .log-box { display: grid; gap: 4px; }
      .log-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
      .log .entry { margin-bottom: 12px; }
      .log summary { cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .log pre { margin: 2px 0 0; font: inherit; white-space: pre-wrap; padding-left: 8px; border-left: 2px solid #0002; }
      body[data-theme='dark'] .log pre { border-left-color: #fff3; }
      .log .section { margin-top: 8px; font: 600 12px/16px system-ui, sans-serif; color: #776; }
      .log { font: 12px/16px ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 70vh; overflow: auto; background: #0001; padding: 8px; }
      .chat { padding: 16px; overflow: auto; }
      .column { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; width: 100%; }
      .turn { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
      .turn-head { display: flex; gap: 8px; align-items: baseline; font-weight: 600; }
      .args { flex: 1; min-width: 0; font-weight: 400; color: #776; }
      .args summary { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .args[open] summary { white-space: normal; }
      .args[open] summary span { display: none; }
      .args pre { margin: 4px 0 0; font: 12px/16px ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
      @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } #side-resize { display: none; } .side { border-right: 0; border-bottom: 1px solid #0002; } .chat { padding: 16px 8px; } }
      .column-wrap { position: relative; max-width: 100%; min-height: calc(100vh - 32px); }
      body.resizing iframe { pointer-events: none; }
      body.resizing { cursor: ew-resize; user-select: none; }
      #side-resize { right: -16px; z-index: 1; }
      /* The sidebar's border is its edge's line; the handle only darkens it. */
      #side-resize::before { background: transparent; }
      #side-resize:hover::before, #side-resize.dragging::before { background: #0005; }
      body[data-theme='dark'] #side-resize:hover::before, body[data-theme='dark'] #side-resize.dragging::before { background: #fff5; }
      .resize { position: absolute; top: 0; bottom: 0; right: -24px; width: 32px; cursor: ew-resize; touch-action: none; outline: none; display: flex; justify-content: center; }
      .resize::before { content: ''; width: 2px; background: #0002; }
      .resize:hover::before, .resize.dragging::before { background: #0005; }
      body[data-theme='dark'] .resize::before { background: #fff2; }
      body[data-theme='dark'] .resize:hover::before, body[data-theme='dark'] .resize.dragging::before { background: #fff5; }
      .resize span { position: absolute; top: 4px; left: 20px; font: 12px/16px ui-monospace, monospace; color: #776; white-space: nowrap; display: none; }
      .resize:hover span, .resize.dragging span { display: block; }
      iframe { width: 100%; border: 1px dashed #0003; height: 200px; }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="side">
        <div id="side-resize" class="resize" role="separator" aria-orientation="vertical" aria-label="Sidebar width" tabindex="0"><span></span></div>
        <h1>Frets MCP Apps preview</h1>
        <p class="commit">Built at commit <span id="commit"></span></p>
        <p>This page plays the host. It runs the real server in the page, calls a tool, and shows each app in a sandboxed frame, as a chat would.</p>
        <label>Tool
          <select id="tool"><option>show_metronome</option><option>show_tab</option><option>show_tuner</option></select>
        </label>
        <label>Tool arguments (JSON)
          <textarea id="args"></textarea>
        </label>
        <button id="call" type="button">Call</button>
        <button id="again" type="button">Call show_metronome again with the latest rhythm, 5 bpm faster</button>
        <label>Theme
          <select id="theme"><option>light</option><option>dark</option></select>
        </label>
        <section class="log-box" aria-labelledby="log-title">
          <div class="log-head"><span id="log-title">What the model sees</span><button id="clear" type="button">Clear</button></div>
          <div id="log" class="log" aria-live="polite"></div>
        </section>
      </div>
      <div class="chat"><div class="column-wrap"><div id="column" class="column"></div><div id="resize" class="resize" role="separator" aria-orientation="vertical" aria-label="Chat width" tabindex="0"><span></span></div></div></div>
    </div>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
