  <g transform="translate(48 48) scale(0.8) translate(-50 -49)">
    <g stroke="#a8957a" stroke-width="2"><line x1="38" y1="16" x2="38" y2="80"></line><line x1="62" y1="16" x2="62" y2="80"></line></g>
    <rect x="14" y="16" width="4" height="64" rx="1.5" fill="#efe3cb"></rect>
    <g stroke="#e3d5bb" stroke-width="1.5"><line x1="16" y1="24" x2="86" y2="24"></line><line x1="16" y1="40" x2="86" y2="40"></line><line x1="16" y1="56" x2="86" y2="56"></line><line x1="16" y1="72" x2="86" y2="72"></line></g>
    <rect x="18" y="62" width="20" height="20" rx="5" fill="#a8462a" stroke="#f6f0e4" stroke-width="2.5"></rect>
    <circle cx="50" cy="56" r="9" fill="#5c6e30" stroke="#f6f0e4" stroke-width="2.5"></circle>
    <circle cx="74" cy="40" r="9" fill="#946a12" stroke="#f6f0e4" stroke-width="2.5"></circle>
